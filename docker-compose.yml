services:
  php-app:
    build: .
    container_name: php_app
    ports:
      - "${APP_PORT}:80"
    env_file: .env
    volumes:
      - .:/var/www/html          # monta todo el proyecto (public, src, vendor...)
    depends_on:
      - postgres-db
    networks:
      - tienda-network

  postgres-db:
    image: postgres:12-alpine
    container_name: postgres_db
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql   # se ejecuta al crear la BD
      - db_data:/var/lib/postgresql/data
    networks:
      - tienda-network

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres-db
    networks:
      - tienda-network

volumes:
  db_data:

networks:
  tienda-network:
